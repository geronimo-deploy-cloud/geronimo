[project]
name = "iris-batch"
version = "1.0.0"
description = "ML model serving API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "geronimo",
    "pydantic>=2.5.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "boto3>=1.34.0",
    "metaflow>=2.10.0",
    "scikit-learn>=1.3.0",
    "joblib>=1.3.0",
    "httpx>=0.28.1",
    "evidently>=0.7.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.25.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
